name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project (step5)
        run: unzip -o klaws-face-step5.zip
      - name: Make emap.bin from the swapper model
        run: |
          pip install onnx numpy
          mkdir -p app/src/main/assets
          curl -L -o /tmp/inswapper.onnx https://huggingface.co/ezioruan/inswapper_128.onnx/resolve/main/inswapper_128.onnx
          python3 -c "
          import onnx, numpy as np
          from onnx import numpy_helper
          m = onnx.load('/tmp/inswapper.onnx')
          e = numpy_helper.to_array(m.graph.initializer[-1]).astype('<f4')
          assert e.shape == (512, 512), e.shape
          open('app/src/main/assets/emap.bin', 'wb').write(e.tobytes())
          "
          rm /tmp/inswapper.onnx
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KlawsFace-apk
          path: app/build/outputs/apk/debug/*.apk
